[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyuvkin"
version = "0.1.0"
description = "Kinematic modelling of interferometric spectral-line data by forward modelling in the uv-plane"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Hannah Stacey" }]
dependencies = [
    "numpy",
    "scipy",
    "astropy",
    "matplotlib",
    "autofit",
    "autogalaxy",
    "autoarray",
    # data handling, transformers, primary beam and the freeform (phase-1)
    # surface-brightness reconstruction all come from pyuvimage
    "pyuvimage",
    "corner",
]

[project.optional-dependencies]
kinms = ["kinms>=3.0.14"]
galpak = ["galpak==1.34.0"]
jax = ["jax", "nufftax>=0.6.1,<0.7.0"]
ms = ["python-casacore"]
all = ["kinms>=3.0.14", "galpak==1.34.0"]

[project.scripts]
pyuvkin = "pyuvkin.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: end-to-end fits (a minute or so each)"]
filterwarnings = ["ignore::UserWarning", "ignore::DeprecationWarning"]
